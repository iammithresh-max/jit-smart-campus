<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JIT Smart Campus - Full Stack Verification Suite</title>
</head>
<body>
  <div id="results" style="font-family: monospace; white-space: pre; padding: 20px;">Running tests...</div>

  <!-- App DOM Mount -->
  <div class="mobile-viewport" style="display: none;">
    <div id="mobile-app-screen" class="mobile-app-screen"></div>
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
      <a href="#home" class="nav-item active" id="nav-btn-home" data-screen="home">
        <div class="nav-icon"></div>
        <span class="nav-label">Home</span>
      </a>
      <a href="#canteen" class="nav-item" id="nav-btn-canteen" data-screen="canteen">
        <div class="nav-icon"></div>
        <span class="nav-label">Canteen</span>
      </a>
      <a href="#stationery" class="nav-item" id="nav-btn-stationery" data-screen="stationery">
        <div class="nav-icon"></div>
        <span class="nav-label">Stationery</span>
      </a>
      <a href="#history" class="nav-item" id="nav-btn-history" data-screen="history">
        <div class="nav-icon"></div>
        <span class="nav-label">My Orders</span>
      </a>
      <a href="#profile" class="nav-item" id="nav-btn-profile" data-screen="profile">
        <div class="nav-icon"></div>
        <span class="nav-label">Profile</span>
      </a>
    </nav>
    <div id="jit-toast-notification" class="jit-toast"></div>
  </div>

  <script>
    window.__ERRORS = [];
    window.addEventListener('error', function(e) {
      window.__ERRORS.push(e.message + ' at ' + e.filename + ':' + e.lineno);
      var res = document.getElementById('results');
      if (res) res.textContent += '\nWINDOW ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
    });
  </script>

  <script type="module">
    import { 
      initStorage, 
      getAllOrders, 
      getCartState, 
      saveCartState, 
      clearCart, 
      setSafeSession, 
      clearSession, 
      recordPodPaymentCollection, 
      getCollectionRecords, 
      getAuditLogs, 
      getWorkers, 
      updateWorkerPermission,
      getSafeSession
    } from './js/storage.js';
    import { authenticateStudent, authenticateWorker, authenticateOwner, getCurrentUser, logout } from './js/auth.js';
    import { navigateTo, getCurrentScreen, setupGlobalNavigationEvents } from './js/app.js';
    import { APP_CONFIG, DEMO_WORKER_ACCOUNTS, DEMO_OWNER_ACCOUNTS } from './js/data.js';

    const log = [];
    let passCount = 0;
    let failCount = 0;

    function assert(desc, condition) {
      if (condition) {
        log.push(`[PASS] ${desc}`);
        passCount++;
      } else {
        log.push(`[FAIL] ${desc}`);
        failCount++;
        console.error(`Assertion failed: ${desc}`);
      }
    }

    async function runVerification() {
      try {
        log.push("=============================================================");
        log.push("  JIT SMART CAMPUS — FULL STACK UPGRADE VERIFICATION SUITE   ");
        log.push("=============================================================\n");

        initStorage();
        setupGlobalNavigationEvents();
        const appScreen = document.getElementById('mobile-app-screen');

        // =========================================================================
        // TEST 1: STUDENT LOGIN (RegNo + DOB only, no name input, invalid rejects)
        // =========================================================================
        log.push("--- 1. STUDENT AUTHENTICATION TESTS ---");
        clearSession();
        navigateTo('login');
        assert("Navigated to Student Login screen", getCurrentScreen() === 'login');

        const regnoInput = appScreen.querySelector('#login-regno');
        const dobInput = appScreen.querySelector('#login-dob');
        const nameInput = appScreen.querySelector('#login-name, [name="name"], [name="studentName"]');

        assert("Login form contains Registration Number input", regnoInput !== null);
        assert("Login form contains Date of Birth input", dobInput !== null);
        assert("Login form strictly does NOT ask for Student Name", nameInput === null);

        // Test invalid credentials
        let failedLogin = false;
        try {
          await authenticateStudent('INVALID_REG', '01-01-2000');
        } catch (e) {
          failedLogin = true;
          assert("Invalid credentials rejected with secure error", e.message.includes('Invalid Registration Number'));
        }
        assert("Failed login threw expected exception", failedLogin);

        // Test valid student login
        const studentSession = await authenticateStudent('711125104066', '04-11-2007');
        assert("Valid credentials authenticated successfully", studentSession && studentSession.regNo === '711125104066');
        assert("Session stores Student name: Mithresh Kanna S", studentSession.name === 'Mithresh Kanna S');
        assert("Session role is STUDENT", studentSession.role === 'STUDENT');
        
        // Ensure DOB is NOT stored in localStorage session
        const storedSession = getSafeSession();
        assert("DOB is strictly NOT stored in browser session", storedSession.dob === undefined);

        // =========================================================================
        // TEST 2: WORKER LOGIN & 5 DEMO WORKER PROFILES
        // =========================================================================
        log.push("\n--- 2. WORKER AUTHENTICATION & DEMO PROFILES TESTS ---");
        clearSession();
        navigateTo('worker-login');
        assert("Navigated to dedicated Worker Login screen", getCurrentScreen() === 'worker-login');

        const empInput = appScreen.querySelector('#worker-empid');
        const pinInput = appScreen.querySelector('#worker-pin');
        assert("Worker login form contains Employee ID input", empInput !== null);
        assert("Worker login form contains PIN input", pinInput !== null);

        // Verify 5 Fictional Demo Workers exist with plausible adult DOBs
        assert("5 Demo Worker profiles configured", DEMO_WORKER_ACCOUNTS.length === 5);
        const w1 = DEMO_WORKER_ACCOUNTS.find(w => w.empId === 'JIT-W001');
        const w2 = DEMO_WORKER_ACCOUNTS.find(w => w.empId === 'JIT-W002');
        const w3 = DEMO_WORKER_ACCOUNTS.find(w => w.empId === 'JIT-W003');
        const w4 = DEMO_WORKER_ACCOUNTS.find(w => w.empId === 'JIT-W004');
        const w5 = DEMO_WORKER_ACCOUNTS.find(w => w.empId === 'JIT-W005');

        assert("Worker JIT-W001 assigned to Canteen (DOB 1989-04-12)", w1 && w1.assignedShop === 'canteen' && w1.dob === '1989-04-12');
        assert("Worker JIT-W002 assigned to Canteen (DOB 1993-08-25)", w2 && w2.assignedShop === 'canteen' && w2.dob === '1993-08-25');
        assert("Worker JIT-W003 assigned to Stationery (DOB 1988-06-15)", w3 && w3.assignedShop === 'stationery' && w3.dob === '1988-06-15');
        assert("Worker JIT-W004 assigned to Stationery (DOB 1995-11-03, canCollect=false)", w4 && w4.assignedShop === 'stationery' && !w4.canCollectPayment);
        assert("Worker JIT-W005 assigned to Printing (DOB 1992-02-18)", w5 && w5.assignedShop === 'printing' && w5.dob === '1992-02-18');

        // Test invalid worker credentials
        let failedWorkerLogin = false;
        try {
          await authenticateWorker('JIT-W001', 'wrong_pin');
        } catch (e) {
          failedWorkerLogin = true;
          assert("Invalid worker PIN rejected", e.message.includes('Invalid Employee ID or Security PIN'));
        }
        assert("Worker login failure handled correctly", failedWorkerLogin);

        // Test valid worker login
        const workerSession = await authenticateWorker('JIT-W001', 'demo123');
        assert("Worker JIT-W001 signed in successfully", workerSession && workerSession.empId === 'JIT-W001');
        assert("Worker session assigned shop is canteen", workerSession.assignedShop === 'canteen');

        // =========================================================================
        // TEST 3: SHOP OWNER LOGIN & RBAC ISOLATION
        // =========================================================================
        log.push("\n--- 3. SHOP OWNER AUTHENTICATION & DASHBOARD TESTS ---");
        clearSession();
        navigateTo('owner-login');
        assert("Navigated to dedicated Owner Login screen", getCurrentScreen() === 'owner-login');

        // Verify Demo Owners
        assert("2 Demo Owner profiles configured (JIT-O001, JIT-O002)", DEMO_OWNER_ACCOUNTS.length === 2);
        const ownerSession = await authenticateOwner('JIT-O001', 'owner123');
        assert("Owner JIT-O001 signed in successfully", ownerSession && ownerSession.ownerId === 'JIT-O001');
        assert("Owner JIT-O001 authorized strictly for canteen", ownerSession.assignedShops.includes('canteen') && !ownerSession.assignedShops.includes('stationery'));

        navigateTo('owner');
        assert("Current screen is 'owner'", getCurrentScreen() === 'owner');
        const ownerDashboard = appScreen.querySelector('#owner-dashboard-root');
        assert("Owner dashboard rendered successfully", ownerDashboard !== null);

        // Test Student cannot access Owner dashboard
        setSafeSession(studentSession);
        navigateTo('owner');
        const accessDeniedText = appScreen.textContent;
        assert("Student cannot access Owner Dashboard (Access Denied)", accessDeniedText.includes('Access Denied'));

        // =========================================================================
        // TEST 4: PAY ON DELIVERY (POD) SEPARATE WORKFLOW
        // =========================================================================
        log.push("\n--- 4. PAY ON DELIVERY SEPARATE WORKFLOW TESTS ---");
        setSafeSession(studentSession);

        // Navigate to payment with counter method
        navigateTo('payment', {
          shop: 'canteen',
          items: [{ id: 'food_1', name: 'Crispy Ghee Podi Dosa', price: 45, quantity: 2 }],
          totalAmount: 90,
          specialNotes: 'Table collection'
        });

        const payBtn = appScreen.querySelector('#btn-execute-payment');
        const payBtnLabel = appScreen.querySelector('#btn-pay-label');
        const podCard = appScreen.querySelector('[data-method-id="counter"]');

        assert("Pay on Delivery option card exists", podCard !== null);
        podCard.click();
        assert("Button label updates to 'Place Order · Pay on Delivery'", payBtnLabel.textContent.trim() === 'Place Order · Pay on Delivery');
        assert("Payment button enabled", payBtn.disabled === false);

        // Place POD Order
        const ordersCountBefore = getAllOrders().length;
        payBtn.click();
        const ordersCountAfter = getAllOrders().length;
        assert("POD Order placed and saved in system", ordersCountAfter === ordersCountBefore + 1);

        const newPodOrder = getAllOrders()[0];
        assert("POD Order status is PLACED", newPodOrder.status === 'PLACED');
        assert("POD Payment status is strictly NOT PAID", newPodOrder.payment.status === 'NOT PAID');
        assert("POD Token generated immediately upon order placement", newPodOrder.token && newPodOrder.token.startsWith('C-'));

        // Verify POD Modal message
        const podModal = appScreen.querySelector('#pod-success-modal');
        assert("POD confirmation modal displayed", podModal && podModal.style.display !== 'none');
        assert("POD Modal displays required message: 'Order placed successfully! Please pay at the shop when collecting your order.'", 
          podModal.textContent.includes('Order placed successfully! Please pay at the shop when collecting your order.'));
        assert("POD Modal does NOT say Payment Received", !podModal.textContent.includes('Payment Received'));

        // =========================================================================
        // TEST 5: PHYSICAL PAYMENT COLLECTION BY AUTHORIZED STAFF
        // =========================================================================
        log.push("\n--- 5. PHYSICAL CASH COLLECTION & AUDIT TRAIL TESTS ---");
        
        // 5.1 Test unauthorized worker (JIT-W004 has canCollectPayment: false)
        const workerDeepa = DEMO_WORKER_ACCOUNTS.find(w => w.empId === 'JIT-W004');
        let unauthCollectionFailed = false;
        try {
          recordPodPaymentCollection(newPodOrder.orderId, workerDeepa);
        } catch (e) {
          unauthCollectionFailed = true;
          assert("Unauthorized worker cannot collect cash", e.message.includes('not authorized'));
        }
        assert("Worker without collection permission was blocked", unauthCollectionFailed);

        // 5.2 Test Student cannot collect payment
        let studentCollectionFailed = false;
        try {
          recordPodPaymentCollection(newPodOrder.orderId, studentSession);
        } catch (e) {
          studentCollectionFailed = true;
          assert("Student cannot record payment collection", e.message.includes('Unauthorized: Students'));
        }
        assert("Student payment collection blocked", studentCollectionFailed);

        // 5.3 Test Authorized worker collection (JIT-W001)
        const workerAnitha = DEMO_WORKER_ACCOUNTS.find(w => w.empId === 'JIT-W001');
        const collectionResult = recordPodPaymentCollection(newPodOrder.orderId, workerAnitha);
        assert("Authorized worker confirmed physical cash payment", collectionResult && collectionResult.success === true);
        assert("Collection returns 'Payment Received Successfully'", collectionResult.message === 'Payment Received Successfully');
        assert("Collection returned correct order ID and token", collectionResult.orderId === newPodOrder.orderId && collectionResult.token === newPodOrder.token);
        assert("Collection recorded collected amount ₹90", collectionResult.amount === 90);

        // Verify order status updated to PAID
        const collectedOrder = getAllOrders().find(o => o.orderId === newPodOrder.orderId);
        assert("Order payment status updated to PAID after staff confirmation", collectedOrder.payment.status === 'PAID');
        assert("Order recorded staff ID who collected (JIT-W001)", collectedOrder.payment.collectedBy === 'JIT-W001');

        // 5.4 Prevent duplicate collection
        let duplicateCollectionFailed = false;
        try {
          recordPodPaymentCollection(newPodOrder.orderId, workerAnitha);
        } catch (e) {
          duplicateCollectionFailed = true;
          assert("Duplicate collection blocked", e.message.includes('already been collected'));
        }
        assert("Duplicate cash collection prevented", duplicateCollectionFailed);

        // 5.5 Verify collection record persisted
        const allRecords = getCollectionRecords();
        const foundRecord = allRecords.find(r => r.orderId === newPodOrder.orderId);
        assert("Collection record stored with order ID, token, amount, and staff ID", foundRecord && foundRecord.amount === 90 && foundRecord.staffId === 'JIT-W001');

        // 5.6 Verify audit log entry
        const logs = getAuditLogs();
        const foundLog = logs.find(l => l.details.includes(newPodOrder.orderId) && l.action === 'POD_PAYMENT_COLLECTION');
        assert("Audit log recorded payment collection action", foundLog !== undefined);

        // =========================================================================
        // TEST 6: DYNAMIC PAYMENT BUTTON LABELS & NO QR CODES
        // =========================================================================
        log.push("\n--- 6. PAYMENT BUTTON LABELS & ZERO QR CODES ---");
        navigateTo('payment', {
          shop: 'canteen',
          items: [{ id: 'food_1', name: 'Dosa', price: 60, quantity: 2 }],
          totalAmount: 120
        });

        const payBtnElement = appScreen.querySelector('#btn-execute-payment');
        const labelElement = appScreen.querySelector('#btn-pay-label');

        // Check disabled when none selected
        assert("Payment button initially disabled with 'Select a Payment Method'", payBtnElement.disabled === true && labelElement.textContent.trim() === 'Select a Payment Method');

        // Check Google Pay
        appScreen.querySelector('[data-method-id="gpay"]').click();
        assert("Label is 'Pay ₹120 with Google Pay'", labelElement.textContent.trim() === 'Pay ₹120 with Google Pay');

        // Check PhonePe
        appScreen.querySelector('[data-method-id="phonepe"]').click();
        assert("Label is 'Pay ₹120 with PhonePe'", labelElement.textContent.trim() === 'Pay ₹120 with PhonePe');

        // Check Paytm
        appScreen.querySelector('[data-method-id="paytm"]').click();
        assert("Label is 'Pay ₹120 with Paytm'", labelElement.textContent.trim() === 'Pay ₹120 with Paytm');

        // Check BHIM UPI
        appScreen.querySelector('[data-method-id="bhim"]').click();
        assert("Label is 'Pay ₹120 with BHIM UPI'", labelElement.textContent.trim() === 'Pay ₹120 with BHIM UPI');

        // Check Card
        appScreen.querySelector('[data-method-id="card"]').click();
        assert("Label is 'Pay ₹120 with Card'", labelElement.textContent.trim() === 'Pay ₹120 with Card');

        // Check Net Banking
        appScreen.querySelector('[data-method-id="netbanking"]').click();
        assert("Label is 'Pay ₹120 with Net Banking'", labelElement.textContent.trim() === 'Pay ₹120 with Net Banking');

        // Check Wallet
        appScreen.querySelector('[data-method-id="wallet"]').click();
        assert("Label is 'Pay ₹120 with Wallet'", labelElement.textContent.trim() === 'Pay ₹120 with Wallet');

        // Check Pay on Delivery
        appScreen.querySelector('[data-method-id="counter"]').click();
        assert("Label is 'Place Order · Pay on Delivery'", labelElement.textContent.trim() === 'Place Order · Pay on Delivery');

        // Verify ZERO QR Codes in app screen
        const qrElements = appScreen.querySelectorAll('img[src*="qr"], svg.qr-code, canvas.qr-code, [id*="qrcode"]');
        assert("Strictly ZERO QR codes rendered anywhere in checkout or payment", qrElements.length === 0);

        // Check Token screen also has zero QR codes
        navigateTo('token', { orderId: newPodOrder.orderId });
        const tokenQrElements = appScreen.querySelectorAll('img[src*="qr"], svg.qr-code, canvas.qr-code, [id*="qrcode"]');
        assert("Digital Token Pass contains ZERO QR codes", tokenQrElements.length === 0);

        // =========================================================================
        // TEST 7: PROFILE & MY ORDERS NAVIGATION & FILTERS
        // =========================================================================
        log.push("\n--- 7. PROFILE & MY ORDERS NAVIGATION TESTS ---");
        setSafeSession(studentSession);

        // Profile screen test
        navigateTo('profile');
        assert("Navigated to profile screen", getCurrentScreen() === 'profile');
        assert("Profile shows verified student Mithresh Kanna S", appScreen.textContent.includes('Mithresh Kanna S'));
        assert("Profile shows Registration Number 711125104066", appScreen.textContent.includes('711125104066'));
        assert("Profile shows Department CSE", appScreen.textContent.includes('Computer Science'));

        const profileBackBtn = appScreen.querySelector('#profile-back-btn');
        assert("Profile back button exists", profileBackBtn !== null);
        profileBackBtn.click();
        assert("Back button navigates to home", getCurrentScreen() === 'home');

        // My Orders screen test
        navigateTo('history');
        assert("Navigated to My Orders screen", getCurrentScreen() === 'history');
        assert("My Orders lists the placed POD order ID", appScreen.textContent.includes(newPodOrder.orderId));
        assert("My Orders lists token number", appScreen.textContent.includes(newPodOrder.token));

        // Test filters
        const activeFilterBtn = appScreen.querySelector('[data-filter="active"]');
        const completedFilterBtn = appScreen.querySelector('[data-filter="completed"]');
        assert("Active filter button exists", activeFilterBtn !== null);
        assert("Completed filter button exists", completedFilterBtn !== null);

        // =========================================================================
        // TEST 8: WORKER PERMISSION MANAGEMENT BY SHOP OWNER
        // =========================================================================
        log.push("\n--- 8. WORKER PERMISSION MANAGEMENT TESTS ---");
        const workerDeepaBefore = getWorkers().find(w => w.empId === 'JIT-W004');
        assert("Worker JIT-W004 initially cannot collect payment", workerDeepaBefore.canCollectPayment === false);

        // Owner updates permission
        updateWorkerPermission('JIT-W004', true, ownerSession);
        const workerDeepaAfter = getWorkers().find(w => w.empId === 'JIT-W004');
        assert("Owner granted cash collection permission to JIT-W004", workerDeepaAfter.canCollectPayment === true);

        // Revert back
        updateWorkerPermission('JIT-W004', false, ownerSession);
        assert("Permission toggled back to disabled", getWorkers().find(w => w.empId === 'JIT-W004').canCollectPayment === false);

        log.push("\n=============================================================");
        log.push(`  VERIFICATION COMPLETED: ${passCount} PASSED, ${failCount} FAILED  `);
        log.push("=============================================================");

      } catch (err) {
        log.push(`\n[FATAL SUITE ERROR] ${err.message}\n${err.stack}`);
        failCount++;
      }

      const resultsText = log.join('\n');
      document.getElementById('results').textContent = resultsText;
      console.log(resultsText);

      // Report to local runner listeners
      try {
        await fetch('http://localhost:5505/', { method: 'POST', body: resultsText });
      } catch (e) {}

      try {
        await fetch('/report-test-results', { method: 'POST', body: resultsText });
      } catch (e) {}
    }

    runVerification();
  </script>
</body>
</html>
