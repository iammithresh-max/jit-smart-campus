<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="JIT SMART CAMPUS - Mobile-First Canteen & Stationery Crowd Management System for Jansons Institute of Technology. Order food, buy academic supplies, upload PDFs for printing, and collect with queue-based tokens.">
  <meta name="theme-color" content="#0F172A">
  <title>JITORA - JIT SMART CAMPUS | Your Campus. Your Convenience.</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="assets/jitora-logo.png">
  <link rel="apple-touch-icon" href="assets/jitora-logo.png">
  <link rel="preload" as="image" href="assets/jitora-logo.png">
  
  <!-- Application CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Immediate critical style to prevent any blank screen or white flash -->
  <style id="jitora-splash-critical">
    #jitora-splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #FFFFFF;
      z-index: 9999999;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- ==========================================================================
       JITORA ANIMATED OPENING SPLASH SCREEN
       First visual visitors see. Clean white backdrop, smooth original logo zoom,
       dual blue/orange ambient glow, light sweep sheen, tagline, and skip option.
       ========================================================================== -->
  <div id="jitora-splash-screen" class="jitora-splash-screen" role="dialog" aria-modal="true" aria-label="JITORA Welcome Splash Screen">
    <!-- Top-Right Skip Intro Button -->
    <button type="button" class="splash-skip-btn" id="splash-skip-btn" aria-label="Skip introduction and proceed to app">
      <span>Skip Intro</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="5 4 15 12 5 20 5 4"></polygon>
        <line x1="19" y1="5" x2="19" y2="19"></line>
      </svg>
    </button>

    <div class="splash-main-content">
      <!-- Ambient Blue and Orange Dual Glow (behind logo) -->
      <div class="splash-glow-halo" aria-hidden="true"></div>

      <!-- Exact Logo Wrapper with High-Gloss Sheen Sweep -->
      <div class="splash-logo-container">
        <img 
          src="assets/jitora-logo.png" 
          alt="JITORA - Your Campus. Your Convenience." 
          class="splash-logo-image" 
          id="splash-logo-image"
          width="280"
          height="280"
          decoding="sync"
          loading="eager"
        />
        <div class="splash-sheen-sweep" aria-hidden="true"></div>
      </div>

      <!-- Tagline: "Your Campus. Your Convenience." -->
      <div class="splash-tagline-container">
        <p class="splash-tagline-text">
          <span class="tagline-part-1">Your Campus.</span>
          <span class="tagline-separator">•</span>
          <span class="tagline-part-2">Your Convenience.</span>
        </p>
      </div>

      <!-- Subtle Progress Indicator for ~3s visual pacing -->
      <div class="splash-progress-track" aria-hidden="true">
        <div class="splash-progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       DESKTOP SIMULATOR WRAPPER
       Provides demonstration viewport switching (320px, 360px, 375px, 390px, 412px, 430px, Full)
       ========================================================================== -->
  <div class="simulator-outer-shell">
    
    <!-- Top Viewport Testing Bar for College Evaluator / Reviewers -->
    <header class="simulator-top-toolbar" role="region" aria-label="Viewport Screen Switcher">
      <div class="toolbar-brand-title">
        <span class="brand-dot"></span>
        <span><strong style="color: #60A5FA;">JIT</strong><strong style="color: #FB923C;">ORA</strong> • MOBILE PREVIEW</span>
      </div>

      <div class="viewport-presets-group">
        <span class="viewport-label">📱 Target Screen:</span>
        <button type="button" class="viewport-size-pill" data-width="320">320px</button>
        <button type="button" class="viewport-size-pill" data-width="360">360px</button>
        <button type="button" class="viewport-size-pill" data-width="375">375px</button>
        <button type="button" class="viewport-size-pill active" data-width="390">390px (iPhone 15)</button>
        <button type="button" class="viewport-size-pill" data-width="412">412px (Android)</button>
        <button type="button" class="viewport-size-pill" data-width="430">430px (Pro Max)</button>
        <button type="button" class="viewport-size-pill" data-width="full">🖥️ Responsive Full</button>
      </div>
    </header>

    <!-- Mobile Smartphone Shell Frame -->
    <main class="device-viewport-frame" id="simulator-viewport-wrapper">
      
      <!-- Top Smartphone Speaker Notch -->
      <div class="mobile-device-notch" aria-hidden="true">
        <div class="notch-pill"></div>
      </div>

      <!-- Main Application Mount Point (Scrollable Screen) -->
      <div class="mobile-app-screen" id="mobile-app-screen" role="main">
        <!-- Rendered dynamically by JavaScript -->
      </div>

      <!-- ==========================================================================
           4. MOBILE BOTTOM NAVIGATION (Fixed)
           ========================================================================== -->
      <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile Navigation">
        <!-- Tab 1: Home -->
        <a href="#home" class="nav-item active" data-screen="home" id="nav-btn-home">
          <div class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span>Home</span>
        </a>

        <!-- Tab 2: Canteen -->
        <a href="#canteen" class="nav-item" data-screen="canteen" id="nav-btn-canteen">
          <div class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
          </div>
          <span>Canteen</span>
        </a>

        <!-- Tab 3: Stationery -->
        <a href="#stationery" class="nav-item" data-screen="stationery" id="nav-btn-stationery">
          <div class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </div>
          <span>Stationery</span>
        </a>

        <!-- Tab 4: My Orders -->
        <a href="#history" class="nav-item" data-screen="history" id="nav-btn-history">
          <div class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </div>
          <span>My Orders</span>
          <!-- Active Orders Badge bubble -->
          <span class="nav-badge-bubble" id="nav-orders-badge" style="display: none;">0</span>
        </a>

        <!-- Tab 5: Profile -->
        <a href="#profile" class="nav-item" data-screen="profile" id="nav-btn-profile">
          <div class="nav-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span>Profile</span>
        </a>
      </nav>

    </main>

  </div>

  <!-- Toast Notification Node -->
  <div id="jit-toast-notification" class="jit-toast" role="status" aria-live="polite"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
